spring:
  application:
    name: address-service
  config:
    import: optional:configserver:http://localhost:9999
  datasource:
    url: jdbc:mysql://localhost:3306/ritesh_db
    username: root
    password: admin

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

  metrics:
    export:
      prometheus:
        enabled: true
      otlp:
        enabled: false

logging:
  level:
    root: INFO
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "